name: scan
# Spouští scan 13 ze 16 zdrojů proti Turso (CESYS trojici vynechává přes SCAN_EXCLUDE_SOURCES
# níže) a posílá notifikace na Telegram.
# GitHub-hosted runner nemá 300s limit jako Vercel funkce → write-heavy scan v pohodě doběhne.
on:
  schedule:
    # Každé 2 h (UTC); public repo = neomezené free minuty (soukromá repa čerpají 2000 min/měs,
    # tohle ne).
    # ⚠️ GitHub NEGARANTUJE čas spuštění scheduled workflow — při zátěži je odkládá i zahazuje.
    # Naměřeno 2026-07-29: reálné starty 06:27, 02:09, 22:54, 21:03, 19:16, 16:03 → mezery
    # 1,8–4,5 h místo 2 h. Nedá se to na straně GitHubu opravit; mitigace je Mac launchd fallback
    # (ops/launchd, běží v :40 z rezidenční IP a dojede zdroje, které cloudová IP nedá).
    # Scan je idempotentní, takže vynechaný slot jen zpozdí data, nic nerozbije.
    - cron: '0 */2 * * *'
  workflow_dispatch:          # ruční spuštění z Actions UI / gh workflow run
concurrency:
  group: scan
  cancel-in-progress: false   # nech doběhnout, nepřekrývej běhy
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: run scan
        run: npm run scan
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # CESYS zdroje (dovolenkovani.cz, firotravel.cz, api-ng.cesys.eu) zahazují datacentrovou
          # IP GitHubu už na úrovni spojení (`fetch failed`), takže je cloud nikdy nedá.
          # Naměřeno v source_runs za 7 dní (2026-08-27 → 09-03): dovolenkovani 0/55 ok,
          # firo 0/55, zajezdy 0/56 (34× partial s 0 nabídkami + 22× failed). Každý pokus jen
          # zapsal `failed` řádek a živil 🛠 health alerty. Pokrývá je Mac launchd fallback
          # (ops/launchd, rezidenční IP). Vratné: smaž tenhle řádek, kdyby CESYS datacentrovou IP
          # někdy pustil.
          SCAN_EXCLUDE_SOURCES: dovolenkovani,firo,zajezdy
